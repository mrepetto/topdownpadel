name: Assemble exact backup video

on:
  push:
    branches:
      - backup/2026-11-06-2353-stage

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and verify immutable snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .backup-chunks/part-* | base64 -d > web/splash-intro.mp4
          test "$(git hash-object web/splash-intro.mp4)" = "03fbf025a6d590dd28ffdad52b366d39bd325221"
          rm -rf .backup-chunks .github/workflows/assemble-backup-video.yml
          git add -A
          test "$(git write-tree)" = "955828652c229407e16d2ae545a2c0f4da26b433"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Back up v181 splash and compact mobile HUD"
          git push origin HEAD:backup/2026-11-06-2353-stage
